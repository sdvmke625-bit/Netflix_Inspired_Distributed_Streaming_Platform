global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client 60s
    timeout server 60s

frontend catalog_http
    bind :8000
    default_backend catalog_http_nodes

backend catalog_http_nodes
    balance roundrobin
    retries 1
    option redispatch 1
    option httpchk GET /health/
    http-check expect status 200
    server catalog1 movie_catalog_1:8000 check inter 2s fall 2 rise 2
    server catalog2 movie_catalog_2:8000 check inter 2s fall 2 rise 2

frontend catalog_tcp
    bind :9002
    mode tcp
    default_backend catalog_tcp_nodes

backend catalog_tcp_nodes
    mode tcp
    balance roundrobin
    retries 1
    option redispatch 1
    option tcp-check
    server catalog1 movie_catalog_1:9002 check inter 2s fall 2 rise 2
    server catalog2 movie_catalog_2:9002 check inter 2s fall 2 rise 2
